<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>Nova AI Cloud</title><script src="https://js.puter.com/v2/"></script>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e2b;--muted:#a7b0c4;--accent:#8b9dff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f7fb;font:16px system-ui,Arial;min-height:100dvh;display:flex;flex-direction:column}header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #303647;position:sticky;top:0;background:#10131bee} .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#657aff,#bd80ff);display:grid;place-items:center;font-weight:800;font-size:21px}header h1{font-size:19px;margin:0}header small{color:var(--muted)}.pill{margin-left:auto;border:1px solid #38415a;border-radius:20px;padding:6px 9px;color:#c8d0ff;font-size:12px}main{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:20px 14px 150px}.welcome{margin:auto 0;text-align:center;padding:28px 10px}.orb{margin:0 auto 18px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#a5b4ff 20%,#7864e9 60%,#202a6d);box-shadow:0 0 55px #6c79ff55}.welcome h2{font-size:clamp(28px,6vw,40px);margin:0 0 8px}.welcome p{color:var(--muted);line-height:1.6}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}.chips button,.tools button{border:1px solid #394158;background:#1b2130;color:#e8eaff;padding:10px 13px;border-radius:14px}.messages{display:flex;flex-direction:column;gap:14px}.msg{max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;padding:13px 15px;border-radius:18px}.user{align-self:flex-end;background:#343c60}.assistant{align-self:flex-start;background:var(--panel);border:1px solid #2d3447}.msg img{display:block;max-width:100%;border-radius:12px}.err{color:#ffaaa7}.dock{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#10131b 18%)}.tools{display:flex;gap:8px;max-width:820px;margin:0 auto 9px;overflow:auto}.tools select{border:1px solid #59617a;background:#1b2130;color:#e8eaff;padding:10px 12px;border-radius:14px;min-width:135px}.composer{max-width:820px;margin:auto;display:flex;align-items:flex-end;gap:8px;padding:9px;border:1px solid #394158;background:#1b2130;border-radius:24px;box-shadow:0 8px 30px #0005}.composer textarea{flex:1;min-width:0;max-height:120px;resize:none;background:transparent;border:0;outline:0;color:white;font:16px system-ui;padding:9px}.composer button{border:0;border-radius:50%;width:43px;height:43px;background:var(--accent);color:#11162b;font-size:23px;flex-shrink:0}.note{text-align:center;color:#8790a5;font-size:11px;margin-top:7px}.hide{display:none!important}button{cursor:pointer}
</style></head><body>
<header><div class="logo">N</div><div><h1>Nova AI Cloud</h1><small>AI assistant · mobile ready</small></div><div class="pill" id="status">Connecting…</div></header>
<main><section class="welcome" id="welcome"><div class="orb"></div><h2>What can I help with?</h2><p>Chat, learn, write code, brainstorm or create an image.<br>Free cloud access may have limits.</p><div class="chips"><button data-prompt="Explain artificial intelligence simply">Explain AI</button><button data-prompt="Help me build a website">Build a website</button><button data-prompt="Give me a creative image prompt">Create an image</button></div></section><section class="messages" id="messages" aria-live="polite"></section></main>
<div class="dock"><div class="tools"><button id="chatMode">💬 Chat</button><button id="imageMode">🎨 Image</button><button id="videoMode">🎬 Video</button><select id="imageStyle" class="hide" aria-label="Image style"><option value="realistic">Realistic</option><option value="anime">Anime</option></select><button id="authMode">🔑 Continue free</button><button id="clear">＋ New chat</button></div><input id="fileInput" type="file" multiple hidden><div id="attachments" class="note" style="text-align:left;max-width:820px;margin:0 auto 6px"></div><div class="composer"><button id="attach" aria-label="Attach files" title="Upload files">＋</button><textarea id="prompt" rows="1" placeholder="Message Nova AI…"></textarea><button id="send" aria-label="Send">↑</button></div><div class="note">Nova uses free public services when available. Avoid sharing sensitive data.</div></div>
<script>
const $=id=>document.getElementById(id);let history=[],busy=false,mode="chat",selectedFiles=[];
const saved=()=>{try{localStorage.setItem("nova-cloud-history",JSON.stringify(history.slice(-40)))}catch{}};
function bubble(role,text){$("welcome").classList.add("hide");const d=document.createElement("div");d.className="msg "+role;d.textContent=text;$("messages").append(d);window.scrollTo(0,document.body.scrollHeight);return d}
function setMode(m){mode=m;$("imageStyle").classList.toggle("hide",m!=="image");$("prompt").placeholder=m==="image"?"Describe your image…":m==="video"?"Describe the video to generate…":"Message Nova AI…";$("chatMode").style.borderColor=m==="chat"?"#a5b4ff":"#394158";$("imageMode").style.borderColor=m==="image"?"#a5b4ff":"#394158";$("videoMode").style.borderColor=m==="video"?"#a5b4ff":"#394158"}
$("attach").onclick=()=>$("fileInput").click();
$("fileInput").onchange=()=>{selectedFiles=[...selectedFiles,...Array.from($("fileInput").files||[])];renderAttachments();$("fileInput").value="";};
function renderAttachments(){$("attachments").replaceChildren();selectedFiles.forEach((f,i)=>{const row=document.createElement("div");row.style.cssText="display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border:1px solid #394158;border-radius:10px;margin:3px 0";const label=document.createElement("span");label.textContent="📎 "+f.name+" ("+Math.max(1,Math.round(f.size/1024))+" KB)";label.style.overflowWrap="anywhere";const remove=document.createElement("button");remove.textContent="×";remove.style.cssText="background:transparent;color:#fff;border:0;font-size:18px";remove.onclick=()=>{selectedFiles.splice(i,1);renderAttachments()};row.append(label,remove);$("attachments").append(row)})}
async function fileToDataURL(file){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
async function readTextFiles(files){const out=[];for(const f of files){if(f.type.startsWith("text/")||/\.(txt|md|json|csv|html?|css|js|py|xml|ya?ml|log)$/i.test(f.name)){if(f.size>500000)throw Error(f.name+" is too large for text attachment (max 500 KB).");out.push("\n\n[Attached file: "+f.name+"]\n"+(await f.text()))}}return out.join("\n")}
$("chatMode").onclick=()=>setMode("chat");$("imageMode").onclick=()=>setMode("image");$("videoMode").onclick=()=>setMode("video");
$("authMode").onclick=async()=>{const b=$("authMode");b.disabled=true;b.textContent="Opening sign-in…";try{if(!window.puter||!puter.auth)throw Error("Puter load nahi hua. Page reload karo.");await puter.auth.signIn({attempt_temp_user_creation:true});$("status").textContent="Signed in";b.textContent="✓ Connected";bubble("assistant","Puter connected. Ab apna message dobara bhejo.");}catch(e){b.textContent="🔑 Continue free";bubble("assistant","Sign-in complete nahi hua: "+(e.msg||e.message||"Unknown error")+". Chrome mein Nova link seedha kholo; in-app browser ke bajaye Open in Chrome try karo.");}finally{b.disabled=false}};
$("clear").onclick=()=>{history=[];$("messages").replaceChildren();$("welcome").classList.remove("hide");saved()};
document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{$("prompt").value=b.dataset.prompt;send()});
function novaCoreReply(input){const q=input.toLowerCase().trim();const has=(re)=>re.test(q);
if(/^(hi|hello|hey|namaste|salam|hola)\\b/.test(q))return "Hello! Main Nova Core hoon. Main basic offline help, simple explanations aur planning mein madad kar sakta hoon.";
if(has(/\\b(who are you|tum kaun|your name|apna naam)\\b/))return "Main Nova Core hoon — Nova AI ka lightweight local assistant engine. Main abhi fully trained large language model nahi hoon; main simple intent rules aur offline fallback use karta hoon.";
if(has(/\\b(capabilities|what can you do|help|madad)\\b/))return "Abhi main greetings, basic intent detection, study explanations, planning prompts aur coding ke starter hints de sakta hoon. Detailed reasoning, current information aur image/video generation ke liye online provider chahiye.";
if(has(/\\b(image|picture|photo)\\b/))return "Image banane ke liye 🎨 Image mode select karke prompt bhejo. Chat mode sirf text jawab deta hai.";
if(has(/\\b(video|clip|movie)\\b/))return "Video banane ke liye 🎬 Video mode select karke scene describe karo. Iske liye online video provider available hona chahiye.";
if(has(/\\b(remember|memory|yaad)\\b/))return "Is version mein chat history isi browser ke local storage mein save hoti hai. Yeh abhi cross-device cloud memory nahi hai.";
if(has(/\\b(ai|artificial intelligence|machine learning|neural network)\\b/))return "AI software hai jo patterns aur examples se tasks karta hai. Neural network data se parameters learn karta hai; large language model ko bahut saare text par train kiya jata hai. Nova Core abhi aisa trained model nahi hai.";
if(has(/\\b(website|html|css|javascript|python|code|program)\\b/))return "Coding help: goal ko chhote steps mein divide karo, pehle minimal working version banao, phir error messages se debug karo. Main offline mode mein full compiler ya repository access nahi rakhta; exact code ke liye online AI connection useful hai.";
if(has(/\\b(plan|schedule|study|learn|routine)\\b/))return "Simple plan: (1) goal ko ek line mein likho, (2) use 20–30 minute ke tasks mein baanto, (3) pehle task ko abhi start karo, (4) progress note karo aur next step adjust karo.";
if(has(/\\b(thank you|thanks|shukriya|dhanyawad)\\b/))return "Khushi hui madad karke! Nova Core ko hum step-by-step improve kar sakte hain.";
return "Nova Core ne tumhara message receive kiya: “"+input+"”. Mere local engine ki knowledge abhi limited hai. Agar online AI connected hai to detailed answer wahan se milega; warna ek specific sawal ya chhota task try karo.";}
async function send(){if(busy)return;let text=$("prompt").value.trim();const files=[...selectedFiles];if(!text&&!files.length)return;try{text+=await readTextFiles(files)}catch(e){bubble("assistant",e.message);return}$("prompt").value="";$("prompt").style.height="auto";bubble("user",text+(files.length?"\n\nFiles: "+files.map(f=>f.name).join(", "):""));const kind=mode;const pending=bubble("assistant",kind==="image"?"Creating image…":kind==="video"?"Creating video…":"Thinking…");busy=true;$("send").disabled=true;$("attach").disabled=true;try{if(!window.puter||!puter.ai)throw Error("AI library load nahi hui. Internet check karke page reload karo.");if(kind==="image"){const style=$("imageStyle").value;const styledPrompt=(style==="anime"?"Anime illustration, detailed linework and expressive colors. Scene: ":"Photorealistic image, natural lighting and detailed textures. Scene: ")+(text||"Use the uploaded reference image to create a polished variation.");const imageFiles=files.filter(f=>f.type.startsWith("image/"));const opts={};if(imageFiles.length)opts.input_images=await Promise.all(imageFiles.map(fileToDataURL));const result=await puter.ai.txt2img(styledPrompt,opts);pending.textContent="";const img=result instanceof HTMLImageElement?result:document.createElement("img");if(!(result instanceof HTMLImageElement))img.src=result.src||String(result);img.alt="AI generated image";img.style.maxWidth="100%";img.style.borderRadius="12px";pending.append(img);const a=document.createElement("a");a.href=img.src;a.download="nova-ai-image.png";a.textContent="Open / save image";a.target="_blank";a.style.display="block";a.style.color="#c8d0ff";a.style.marginTop="10px";pending.append(a);if(files.length>imageFiles.length)pending.append(document.createTextNode("\nOnly image files are used as image references; readable text files were added to the prompt."))}else if(kind==="video"){const result=await puter.ai.txt2vid(text);pending.textContent="";const v=document.createElement("video");v.controls=true;v.playsInline=true;v.style.width="100%";v.style.borderRadius="12px";v.src=result.src||String(result);pending.append(v)}else{const msgs=[...history,{role:"user",content:text}];const result=await puter.ai.chat(msgs.map(m=>({role:m.role,content:m.content})),{model:"gpt-5.6-luna"});let reply=typeof result==="string"?result:result?.message?.content??result?.text??JSON.stringify(result);if(Array.isArray(reply))reply=reply.map(x=>x.text||"").join("\n");reply=String(reply);pending.textContent=reply;history.push({role:"user",content:text},{role:"assistant",content:reply});saved()}selectedFiles=[];renderAttachments()}catch(e){if(kind==="chat"){const reply=novaCoreReply(text);pending.textContent="Nova Core (local fallback)\n"+reply;history.push({role:"user",content:text},{role:"assistant",content:reply});saved()}else{pending.textContent=(e?.errorCode==="moderation_flagged"?"⚠ Image provider ne request reject ki. Is provider ka filter Nova ke code se control nahi hota. Prompt ko allowed content ke saath badal kar try karo.\n\n":"⚠ ")+(e.message||"AI request failed")+"\nProvider/model availability account ke hisaab se vary kar sakti hai.";pending.classList.add("err")}}finally{busy=false;$("send").disabled=false;$("attach").disabled=false;window.scrollTo(0,document.body.scrollHeight)}}$("send").onclick=send;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("prompt").addEventListener("input",()=>{$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,120)+"px"});
try{const old=JSON.parse(localStorage.getItem("nova-cloud-history")||"[]");if(Array.isArray(old)&&old.length){history=old.slice(-40);$("welcome").classList.add("hide");history.forEach(m=>bubble(m.role==="user"?"user":"assistant",m.content))}}catch{}
setTimeout(()=>{$("status").textContent=window.puter?"AI ready":"Loading AI…"},500);
</script></body></html>
