
<style>
#novaPlusMenu {
  display: none;
  position: absolute;
  bottom: 55px;
  left: 0;
  width: 230px;
  padding: 8px;
  background: #202636;
  border: 1px solid #454d65;
  border-radius: 16px;
  z-index: 9999;
  box-shadow: 0 8px 25px #0008;
}
#novaPlusMenu button {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 2px 0;
  color: white;
  background: transparent;
  border: 0;
  border-radius: 9px;
  text-align: left;
  font-size: 15px;
}
#novaPlusMenu button:active { background: #393f56; }
#novaPlus { font-size: 24px; cursor: pointer; }
#novaAttachment {
  display: none;
  color: #c9c0ff;
  font-size: 12px;
  padding: 6px;
}
</style>

<script>
(function () {
  const composer = document.querySelector(".composer");
  if (!composer || document.getElementById("novaPlus")) return;

  const plus = document.createElement("button");
  plus.id = "novaPlus";
  plus.className = "iconbtn";
  plus.type = "button";
  plus.textContent = "+";
  plus.setAttribute("aria-label", "Upload options");

  const menu = document.createElement("div");
  menu.id = "novaPlusMenu";
  menu.innerHTML = `
    <button data-type="image">🖼️ Upload image</button>
    <button data-type="camera">📷 Take photo</button>
    <button data-type="file">📎 Upload PDF / file</button>
    <button data-type="text">📝 Upload TXT / CSV</button>
  `;

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*,.pdf,.txt,.md,.csv";
  input.hidden = true;

  const preview = document.createElement("div");
  preview.id = "novaAttachment";

  composer.style.position = "relative";
  composer.prepend(plus, menu, input);
  composer.insertAdjacentElement("beforebegin", preview);

  let selectedFile = null;

  plus.onclick = () => {
    menu.style.display =
      menu.style.display === "block" ? "none" : "block";
  };

  menu.querySelectorAll("button").forEach(button => {
    button.onclick = () => {
      menu.style.display = "none";
      const type = button.dataset.type;

      input.removeAttribute("capture");
      if (type === "image") input.accept = "image/*";
      if (type === "camera") {
        input.accept = "image/*";
        input.setAttribute("capture", "environment");
      }
      if (type === "file") input.accept = ".pdf,.txt,.md,.csv";
      if (type === "text") input.accept = ".txt,.md,.csv";

      input.click();
    };
  });

  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
      alert("Please select a file under 5 MB.");
      input.value = "";
      return;
    }

    selectedFile = file;
    preview.style.display = "block";
    preview.textContent =
      "📎 " + file.name + " — tap here to remove";
  };

  preview.onclick = () => {
    selectedFile = null;
    input.value = "";
    preview.style.display = "none";
  };

  // Make the selected attachment available to your chat code.
  window.getNovaSelectedFile = () => selectedFile;
})();
</script>
