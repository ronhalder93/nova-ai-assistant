<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>Nova AI Cloud</title><script src="https://js.puter.com/v2/"></script>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e2b;--muted:#a7b0c4;--accent:#8b9dff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f7fb;font:16px system-ui,Arial;min-height:100dvh;display:flex;flex-direction:column}header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #303647;position:sticky;top:0;background:#10131bee} .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#657aff,#bd80ff);display:grid;place-items:center;font-weight:800;font-size:21px}header h1{font-size:19px;margin:0}header small{color:var(--muted)}.pill{margin-left:auto;border:1px solid #38415a;border-radius:20px;padding:6px 9px;color:#c8d0ff;font-size:12px}main{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:20px 14px 150px}.welcome{margin:auto 0;text-align:center;padding:28px 10px}.orb{margin:0 auto 18px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#a5b4ff 20%,#7864e9 60%,#202a6d);box-shadow:0 0 55px #6c79ff55}.welcome h2{font-size:clamp(28px,6vw,40px);margin:0 0 8px}.welcome p{color:var(--muted);line-height:1.6}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}.chips button,.tools button{border:1px solid #394158;background:#1b2130;color:#e8eaff;padding:10px 13px;border-radius:14px}.messages{display:flex;flex-direction:column;gap:14px}.msg{max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;padding:13px 15px;border-radius:18px}.user{align-self:flex-end;background:#343c60}.assistant{align-self:flex-start;background:var(--panel);border:1px solid #2d3447}.msg img{display:block;max-width:100%;border-radius:12px}.err{color:#ffaaa7}.dock{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#10131b 18%)}.tools{display:flex;gap:8px;max-width:820px;margin:0 auto 9px;overflow:auto}.composer{max-width:820px;margin:auto;display:flex;align-items:flex-end;gap:8px;padding:9px;border:1px solid #394158;background:#1b2130;border-radius:24px;box-shadow:0 8px 30px #0005}.composer textarea{flex:1;min-width:0;max-height:120px;resize:none;background:transparent;border:0;outline:0;color:white;font:16px system-ui;padding:9px}.composer button{border:0;border-radius:50%;width:43px;height:43px;background:var(--accent);color:#11162b;font-size:23px;flex-shrink:0}.note{text-align:center;color:#8790a5;font-size:11px;margin-top:7px}.hide{display:none!important}button{cursor:pointer}
</style></head><body>
<header><div class="logo">N</div><div><h1>Nova AI Cloud</h1><small>AI assistant · mobile ready</small></div><div class="pill" id="status">Connecting…</div></header>
<main><section class="welcome" id="welcome"><div class="orb"></div><h2>What can I help with?</h2><p>Chat, learn, write code, brainstorm or create an image.<br>Free cloud access may have limits.</p><div class="chips"><button data-prompt="Explain artificial intelligence simply">Explain AI</button><button data-prompt="Help me build a website">Build a website</button><button data-prompt="Give me a creative image prompt">Create an image</button></div></section><section class="messages" id="messages" aria-live="polite"></section></main>
<div class="dock"><div class="tools"><button id="chatMode">💬 Chat</button><button id="imageMode">🎨 Image</button><button id="videoMode">🎬 Video</button><button id="authMode">🔑 Continue free</button><button id="clear">＋ New chat</button></div><div class="composer"><textarea id="prompt" rows="1" placeholder="Message Nova AI…"></textarea><button id="send" aria-label="Send">↑</button></div><div class="note">Nova uses free public services when available. Avoid sharing sensitive data.</div></div>
<script>
const $=id=>document.getElementById(id);let history=[],busy=false,mode="chat";
const saved=()=>{try{localStorage.setItem("nova-cloud-history",JSON.stringify(history.slice(-40)))}catch{}};
function bubble(role,text){$("welcome").classList.add("hide");const d=document.createElement("div");d.className="msg "+role;d.textContent=text;$("messages").append(d);window.scrollTo(0,document.body.scrollHeight);return d}
function setMode(m){mode=m;$("prompt").placeholder=m==="image"?"Describe the image to generate…":m==="video"?"Describe the video to generate…":"Message Nova AI…";$("chatMode").style.borderColor=m==="chat"?"#a5b4ff":"#394158";$("imageMode").style.borderColor=m==="image"?"#a5b4ff":"#394158";$("videoMode").style.borderColor=m==="video"?"#a5b4ff":"#394158"}
$("chatMode").onclick=()=>setMode("chat");$("imageMode").onclick=()=>setMode("image");$("videoMode").onclick=()=>setMode("video");
$("authMode").onclick=async()=>{const b=$("authMode");b.disabled=true;b.textContent="Opening sign-in…";try{if(!window.puter||!puter.auth)throw Error("Puter load nahi hua. Page reload karo.");await puter.auth.signIn({attempt_temp_user_creation:true});$("status").textContent="Signed in";b.textContent="✓ Connected";bubble("assistant","Puter connected. Ab apna message dobara bhejo.");}catch(e){b.textContent="🔑 Continue free";bubble("assistant","Sign-in complete nahi hua: "+(e.msg||e.message||"Unknown error")+". Chrome mein Nova link seedha kholo; in-app browser ke bajaye Open in Chrome try karo.");}finally{b.disabled=false}};
$("clear").onclick=()=>{history=[];$("messages").replaceChildren();$("welcome").classList.remove("hide");saved()};
document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{$("prompt").value=b.dataset.prompt;send()});
async function send(){if(busy)return;const text=$("prompt").value.trim();if(!text)return;$("prompt").value="";$("prompt").style.height="auto";bubble("user",text);const kind=mode;const pending=bubble("assistant",kind==="image"?"Creating image…":kind==="video"?"Creating video…":"Thinking…");busy=true;$("send").disabled=true;try{if(!window.puter||!puter.ai)throw Error("AI library load nahi hui. Internet check karke page reload karo.");if(kind==="image"){const result=await puter.ai.txt2img(text);pending.textContent="";const img=document.createElement("img");img.alt="AI generated image";img.src=result.src||String(result);pending.append(img);const a=document.createElement("a");a.href=img.src;a.download="nova-ai-image.png";a.textContent="Open / save image";a.target="_blank";a.style.display="block";a.style.color="#c8d0ff";a.style.marginTop="10px";pending.append(a)}else if(kind==="video"){const result=await puter.ai.txt2vid(text);pending.textContent="";const v=document.createElement("video");v.controls=true;v.playsInline=true;v.style.width="100%";v.style.borderRadius="12px";v.src=result.src||String(result);pending.append(v);const a=document.createElement("a");a.href=v.src;a.target="_blank";a.textContent="Open video";a.style.display="block";a.style.color="#c8d0ff";pending.append(a)}else{const msgs=[...history,{role:"user",content:text}];const result=await puter.ai.chat(msgs.map(m=>({role:m.role,content:m.content})),{model:"gpt-5.6-luna"});let reply=typeof result==="string"?result:result?.message?.content??result?.text??JSON.stringify(result);if(Array.isArray(reply))reply=reply.map(x=>x.text||"").join("\n");reply=String(reply);pending.textContent=reply;history.push({role:"user",content:text},{role:"assistant",content:reply});saved()}}catch(e){pending.textContent="⚠ "+(e.message||"AI request failed")+"\nAgar pehli baar hai, Puter sign-in/permission complete karo. Free usage par limits ho sakti hain.";pending.classList.add("err")}finally{busy=false;$("send").disabled=false;window.scrollTo(0,document.body.scrollHeight)}}
$("send").onclick=send;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("prompt").addEventListener("input",()=>{$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,120)+"px"});
try{const old=JSON.parse(localStorage.getItem("nova-cloud-history")||"[]");if(Array.isArray(old)&&old.length){history=old.slice(-40);$("welcome").classList.add("hide");history.forEach(m=>bubble(m.role==="user"?"user":"assistant",m.content))}}catch{}
setTimeout(()=>{$("status").textContent=window.puter?"AI ready":"Loading AI…"},500);
</script></body></html>
