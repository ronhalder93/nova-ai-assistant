<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>Nova AI Cloud</title><script src="https://js.puter.com/v2/"></script>
<style>
:root{color-scheme:light;--bg:#fff;--panel:#f7f7f8;--muted:#6b7280;--accent:#111827}*{box-sizing:border-box}body{margin:0;background:#fff;color:#202123;font:16px system-ui,-apple-system,Arial;min-height:100dvh;display:flex;flex-direction:column}header{height:58px;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;position:sticky;top:0;background:#ffffffee;z-index:3}.logo{width:34px;height:34px;border:0;border-radius:50%;background:#202123;color:white;display:grid;place-items:center;font-weight:700;font-size:17px;flex-shrink:0}.brand-wrap{position:relative}.brand-menu{position:absolute;top:42px;left:0;min-width:150px;padding:6px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 8px 24px #0002;z-index:10}.brand-menu button{width:100%;text-align:left;border:0;background:#fff;color:#202123;padding:11px 12px;border-radius:8px;font:14px system-ui}.brand-menu button:active{background:#f3f4f6}header h1{font-size:17px;font-weight:600;margin:0;color:#202123}header small,.pill{display:none}main{width:100%;max-width:760px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:18px 16px 150px}.welcome{margin:auto 0;text-align:center;padding:24px 4px}.orb{display:none}.welcome h2{font-size:clamp(27px,6vw,34px);font-weight:600;letter-spacing:-.8px;margin:0 0 26px;color:#202123}.welcome p{display:none}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 auto;max-width:560px}.chips button,.tools button{border:1px solid #e5e7eb;background:#fff;color:#343434;padding:11px 14px;border-radius:22px;font-size:14px}.chips button:active{background:#f2f2f2}.messages{display:flex;flex-direction:column;gap:18px}.msg{max-width:94%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:12px 15px;border-radius:18px}.user{align-self:flex-end;background:#f4f4f4;color:#202123}.assistant{align-self:flex-start;background:transparent;color:#202123;border:0;padding-left:2px}.msg img{display:block;max-width:100%;border-radius:12px}.err{color:#b42318}.dock{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 15%);z-index:2}.tools{display:flex;gap:8px;max-width:760px;margin:0 auto 8px;overflow:auto;align-items:center}.tools #videoMode,.tools #authMode,.tools #clear{display:none}.tools button{padding:8px 13px;border-radius:18px;white-space:nowrap}.tools select{border:1px solid #e5e7eb;background:#fff;color:#343434;padding:8px 10px;border-radius:18px;min-width:110px}.composer{max-width:760px;margin:auto;display:flex;align-items:flex-end;gap:8px;padding:9px 10px;border:1px solid #d9d9e3;background:#fff;border-radius:28px;box-shadow:0 2px 9px #0000000d}.composer textarea{flex:1;min-width:0;max-height:130px;resize:none;background:transparent;border:0;outline:0;color:#202123;font:16px system-ui;padding:10px 4px}.composer textarea::placeholder{color:#777}.composer button{border:0;border-radius:50%;width:40px;height:40px;background:#202123;color:#fff;font-size:22px;flex-shrink:0}.composer #attach{background:transparent;color:#555;font-size:26px}.note{text-align:center;color:#777;font-size:11px;margin-top:8px}.hide{display:none!important}button{cursor:pointer}
</style></head><body>
<header><div class="brand-wrap"><button class="logo" id="logoButton" aria-label="Nova menu" aria-expanded="false">N</button><div class="brand-menu hide" id="brandMenu"><button id="menuNewChat">＋ New chat</button></div></div><h1>Nova</h1><div class="pill" id="status">AI ready</div></header>
<main><section class="welcome" id="welcome"><h2>What can I help with?</h2><div class="chips"><button data-mode="image" data-prompt="">＋ Create an image</button><button data-mode="chat" data-prompt="Help me write or edit this: ">✎ Write or edit</button><button data-mode="chat" data-prompt="">Ask anything</button></div></section><section class="messages" id="messages" aria-live="polite"></section></main>
<div class="dock"><div class="tools"><button id="chatMode">Chat</button><button id="imageMode">Image</button><button id="videoMode">Video</button><select id="imageStyle" class="hide" aria-label="Image style"><option value="realistic">Realistic</option><option value="anime">Anime</option></select><select id="imageModel" class="hide" aria-label="Image model"><option value="default">Auto model</option><option value="replicate:black-forest-labs/flux-schnell">FLUX Schnell</option><option value="gpt-image-2">GPT Image</option><option value="gemini-3.1-flash-image">Gemini Flash Image</option></select><button id="authMode">Continue free</button><button id="clear">New chat</button></div><input id="fileInput" type="file" multiple hidden><div id="attachments" class="note" style="text-align:left;max-width:760px;margin:0 auto 6px"></div><div class="composer"><button id="attach" aria-label="Attach files" title="Upload files">＋</button><textarea id="prompt" rows="1" placeholder="Message Nova…"></textarea><button id="send" aria-label="Send">↑</button></div><div class="note">Nova can make mistakes. Check important information.</div></div>
<script>
const $=id=>document.getElementById(id);let history=[],busy=false,mode="chat",selectedFiles=[];
const saved=()=>{try{localStorage.setItem("nova-cloud-history",JSON.stringify(history.slice(-40)))}catch{}};
function formatReply(text){const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return esc(String(text)).replace(/\*\*(.+?)\*\*/gs,"<strong>$1</strong>").replace(/\*(.+?)\*/gs,"<em>$1</em>").replace(/\n/g,"<br>")}function bubble(role,text){$("welcome").classList.add("hide");const d=document.createElement("div");d.className="msg "+role;if(role==="assistant")d.innerHTML=formatReply(text);else d.textContent=text;$("messages").append(d);window.scrollTo(0,document.body.scrollHeight);return d}
function setMode(m){mode=m;$("imageStyle").classList.toggle("hide",m!=="image");$("prompt").placeholder=m==="image"?"Describe your image…":m==="video"?"Describe the video to generate…":"Message Nova AI…";$("chatMode").style.borderColor=m==="chat"?"#a5b4ff":"#394158";$("imageMode").style.borderColor=m==="image"?"#a5b4ff":"#394158";$("videoMode").style.borderColor=m==="video"?"#a5b4ff":"#394158"}
$("attach").onclick=()=>$("fileInput").click();
$("fileInput").onchange=()=>{selectedFiles=[...selectedFiles,...Array.from($("fileInput").files||[])];renderAttachments();$("fileInput").value="";};
function renderAttachments(){$("attachments").replaceChildren();selectedFiles.forEach((f,i)=>{const row=document.createElement("div");row.style.cssText="display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border:1px solid #394158;border-radius:10px;margin:3px 0";const label=document.createElement("span");label.textContent="📎 "+f.name+" ("+Math.max(1,Math.round(f.size/1024))+" KB)";label.style.overflowWrap="anywhere";const remove=document.createElement("button");remove.textContent="×";remove.style.cssText="background:transparent;color:#fff;border:0;font-size:18px";remove.onclick=()=>{selectedFiles.splice(i,1);renderAttachments()};row.append(label,remove);$("attachments").append(row)})}
async function fileToDataURL(file){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
async function readTextFiles(files){const out=[];for(const f of files){if(f.type.startsWith("text/")||/\.(txt|md|json|csv|html?|css|js|py|xml|ya?ml|log)$/i.test(f.name)){if(f.size>500000)throw Error(f.name+" is too large for text attachment (max 500 KB).");out.push("\n\n[Attached file: "+f.name+"]\n"+(await f.text()))}}return out.join("\n")}
$("chatMode").onclick=()=>setMode("chat");$("imageMode").onclick=()=>setMode("image");$("videoMode").onclick=()=>setMode("video");
$("authMode").onclick=async()=>{const b=$("authMode");b.disabled=true;b.textContent="Opening sign-in…";try{if(!window.puter||!puter.auth)throw Error("Puter load nahi hua. Page reload karo.");await puter.auth.signIn({attempt_temp_user_creation:true});$("status").textContent="Signed in";b.textContent="✓ Connected";bubble("assistant","Puter connected. Ab apna message dobara bhejo.");}catch(e){b.textContent="🔑 Continue free";bubble("assistant","Sign-in complete nahi hua: "+(e.msg||e.message||"Unknown error")+". Chrome mein Nova link seedha kholo; in-app browser ke bajaye Open in Chrome try karo.");}finally{b.disabled=false}};
$("clear").onclick=()=>{history=[];$("messages").replaceChildren();$("welcome").classList.remove("hide");saved()};
document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{if(b.dataset.mode)setMode(b.dataset.mode);$("prompt").value=b.dataset.prompt||"";$("prompt").focus()});
function novaCoreReply(input){const q=input.toLowerCase().trim();const has=(re)=>re.test(q);
if(/^(hi|hello|hey|namaste|salam|hola)\\b/.test(q))return "Hello! Main Nova Core hoon. Main basic offline help, simple explanations aur planning mein madad kar sakta hoon.";
if(has(/\\b(who are you|tum kaun|your name|apna naam)\\b/))return "Main Nova Core hoon — Nova AI ka lightweight local assistant engine. Main abhi fully trained large language model nahi hoon; main simple intent rules aur offline fallback use karta hoon.";
if(has(/\\b(capabilities|what can you do|help|madad)\\b/))return "Abhi main greetings, basic intent detection, study explanations, planning prompts aur coding ke starter hints de sakta hoon. Detailed reasoning, current information aur image/video generation ke liye online provider chahiye.";
if(has(/\\b(image|picture|photo)\\b/))return "Image banane ke liye 🎨 Image mode select karke prompt bhejo. Chat mode sirf text jawab deta hai.";
if(has(/\\b(video|clip|movie)\\b/))return "Video banane ke liye 🎬 Video mode select karke scene describe karo. Iske liye online video provider available hona chahiye.";
if(has(/\\b(remember|memory|yaad)\\b/))return "Is version mein chat history isi browser ke local storage mein save hoti hai. Yeh abhi cross-device cloud memory nahi hai.";
if(has(/\\b(ai|artificial intelligence|machine learning|neural network)\\b/))return "AI software hai jo patterns aur examples se tasks karta hai. Neural network data se parameters learn karta hai; large language model ko bahut saare text par train kiya jata hai. Nova Core abhi aisa trained model nahi hai.";
if(has(/\\b(website|html|css|javascript|python|code|program)\\b/))return "Coding help: goal ko chhote steps mein divide karo, pehle minimal working version banao, phir error messages se debug karo. Main offline mode mein full compiler ya repository access nahi rakhta; exact code ke liye online AI connection useful hai.";
if(has(/\\b(plan|schedule|study|learn|routine)\\b/))return "Simple plan: (1) goal ko ek line mein likho, (2) use 20–30 minute ke tasks mein baanto, (3) pehle task ko abhi start karo, (4) progress note karo aur next step adjust karo.";
if(has(/\\b(thank you|thanks|shukriya|dhanyawad)\\b/))return "Khushi hui madad karke! Nova Core ko hum step-by-step improve kar sakte hain.";
return "Nova Core ne tumhara message receive kiya: “"+input+"”. Mere local engine ki knowledge abhi limited hai. Agar online AI connected hai to detailed answer wahan se milega; warna ek specific sawal ya chhota task try karo.";}
async function send(){if(busy)return;let text=$("prompt").value.trim();const files=[...selectedFiles];if(!text&&!files.length)return;try{text+=await readTextFiles(files)}catch(e){bubble("assistant",e.message);return}$("prompt").value="";$("prompt").style.height="auto";bubble("user",text+(files.length?"\n\nFiles: "+files.map(f=>f.name).join(", "):""));const kind=mode;const pending=bubble("assistant",kind==="image"?"Creating image…":kind==="video"?"Creating video…":"Thinking…");busy=true;$("send").disabled=true;$("attach").disabled=true;try{if(!window.puter||!puter.ai)throw Error("AI library load nahi hui. Internet check karke page reload karo.");if(kind==="image"){const style=$("imageStyle").value;const styledPrompt=(style==="anime"?"Anime illustration, detailed linework and expressive colors. ":"Photorealistic image, natural lighting and detailed textures. ")+text;const imageFiles=files.filter(f=>f.type.startsWith("image/"));if(imageFiles.length)throw Error("Reference-image editing is not available with the alternate model yet. Try a text-only prompt.");let altConfigured=false;try{const st=await fetch("/api/adult-image/status");if(st.ok)altConfigured=Boolean((await st.json()).configured)}catch{}if(!altConfigured)throw Error("Adult image model abhi install/configure nahi hua. Genlaxy API key aur model ID Render settings mein add karna hoga. Yeh paid API hai; key chat mein mat bhejna.");const ar=await fetch("/api/adult-image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:styledPrompt})});const ad=await ar.json().catch(()=>({}));if(!ar.ok)throw Error(ad.error||"Alternate image provider failed.");pending.textContent="";const img=document.createElement("img");img.src=ad.image;img.alt="AI generated image";img.style.maxWidth="100%";img.style.borderRadius="12px";pending.append(img);const a=document.createElement("a");a.href=img.src;a.download="nova-ai-image.png";a.textContent="Open / save image";a.target="_blank";a.style.display="block";a.style.color="#3456a1";a.style.marginTop="10px";pending.append(a)}else if(kind==="video"){const result=await puter.ai.txt2vid(text);pending.textContent="";const v=document.createElement("video");v.controls=true;v.playsInline=true;v.style.width="100%";v.style.borderRadius="12px";v.src=result.src||String(result);pending.append(v)}else{const msgs=[...history,{role:"user",content:text}];const result=await puter.ai.chat(msgs.map(m=>({role:m.role,content:m.content})),{model:"gpt-5.6-luna"});let reply=typeof result==="string"?result:result?.message?.content??result?.text??JSON.stringify(result);if(Array.isArray(reply))reply=reply.map(x=>x.text||"").join("\n");reply=String(reply);pending.innerHTML=formatReply(reply);history.push({role:"user",content:text},{role:"assistant",content:reply});saved()}selectedFiles=[];renderAttachments()}catch(e){if(kind==="chat"){const reply=novaCoreReply(text);pending.textContent="Nova Core (local fallback)\n"+reply;history.push({role:"user",content:text},{role:"assistant",content:reply});saved()}else{pending.textContent=(e?.errorCode==="moderation_flagged"?"⚠ Image provider ne request reject ki. Is provider ka filter Nova ke code se control nahi hota. Prompt ko allowed content ke saath badal kar try karo.\n\n":"⚠ ")+(e.message||"AI request failed")+"\nAlternative image model unavailable ho sakta hai. Explicit nudity ya safety-filtered prompts ko bypass nahi kiya ja sakta; non-explicit adult fashion/portrait prompts try karo.";pending.classList.add("err")}}finally{busy=false;$("send").disabled=false;$("attach").disabled=false;window.scrollTo(0,document.body.scrollHeight)}}$("send").onclick=send;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("prompt").addEventListener("input",()=>{$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,120)+"px"});
try{const old=JSON.parse(localStorage.getItem("nova-cloud-history")||"[]");if(Array.isArray(old)&&old.length){history=old.slice(-40);$("welcome").classList.add("hide");history.forEach(m=>bubble(m.role==="user"?"user":"assistant",m.content))}}catch{}
setTimeout(()=>{$("status").textContent=window.puter?"AI ready":"Loading AI…"},500);
</script></body></html>
