
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Nova AI</title>
<style>
:root{color-scheme:light;--text:#171717;--muted:#666;--blue:#315fe9;--lavender:#f1edff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#f4efff 0%,#fff 48%);color:var(--text)}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{height:76px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
.round{width:48px;height:48px;border:0;border-radius:50%;background:#f7f7f7;font-size:25px;display:grid;place-items:center}
.tabs{display:flex;align-items:center;background:#ececec;padding:5px;border-radius:36px}
.tabs button{border:0;border-radius:30px;background:transparent;padding:12px 22px;font-size:16px}
.tabs button.active{background:#fff;box-shadow:0 1px 5px #0001}
#work{color:var(--blue)}
main{flex:1;min-height:0;overflow:auto;padding:10px 22px 20px;display:flex;flex-direction:column}
.spacer{flex:1;min-height:35px}
#voiceHero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;flex:1;min-height:320px;padding:20px 12px 38px}
#voiceHero[hidden]{display:none}
.orb{width:112px;height:112px;border-radius:50%;margin-bottom:28px;background:radial-gradient(ellipse at 50% 70%,#dce7ff 0%,#a9c4ff 42%,#5685f4 72%,#315fe9 100%);box-shadow:inset 0 -8px 18px #fff7,0 2px 8px #0001}
#voiceHero h1{font-size:clamp(25px,5vw,38px);line-height:1.2;margin:0 0 14px;font-weight:700;letter-spacing:-.7px}
#voiceHero p{font-size:clamp(16px,3.6vw,21px);line-height:1.55;color:#666;max-width:540px;margin:0 0 46px}
#startVoice{border:0;border-radius:40px;background:#090909;color:#fff;font-size:20px;font-weight:600;padding:17px 42px;min-width:220px}
#startVoice:active{transform:scale(.98)}
header{height:84px;backdrop-filter:blur(16px)}
/* Nova visual refresh */
.tabs{background:#eae5f5}
.tabs button.active{background:#fff;box-shadow:0 3px 12px #40305b12}
.round{background:#f0edf7;transition:transform .18s ease}
.round:active,.icon:active{transform:scale(.94)}
#voiceHero{position:relative;isolation:isolate;max-width:760px;width:100%;align-self:center;border:1px solid #e9e1fa;border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(246,241,255,.92));box-shadow:0 18px 55px #503b7b0d;margin:12px auto 20px;overflow:hidden}
#voiceHero:before{content:"";position:absolute;z-index:-1;width:250px;height:250px;border-radius:50%;right:-100px;top:-100px;background:radial-gradient(circle,#dcd0ff99,transparent 70%)}
.orb{background:radial-gradient(ellipse at 32% 25%,#fff 0%,#e6dcff 16%,#b9a3ff 43%,#8062f3 72%,#5940bd 100%);box-shadow:inset -8px -10px 24px #3e2b8a35,0 14px 40px #9074ef40;position:relative}
.orb:after{content:"✦";position:absolute;color:#fff;font-size:30px;right:-7px;top:-5px;text-shadow:0 2px 12px #7b61d9}
#voiceHero h1{letter-spacing:-1.2px}
#startVoice{background:linear-gradient(110deg,#171323,#49327f);box-shadow:0 8px 22px #49327f25;transition:transform .18s ease,box-shadow .18s ease}
#startVoice:hover{box-shadow:0 12px 28px #49327f35}
.suggestions{max-width:620px;background:#fff9;border:1px solid #eee8f8;border-radius:22px;padding:8px 16px;box-shadow:0 8px 28px #49327f08}
.suggestion{border-radius:12px;transition:background .15s ease;color:#504b5b}
.suggestion:hover{background:#f6f2ff}
.suggestion span{color:#7859ce}
.composer{border:1px solid #e8e2f3;box-shadow:0 8px 30px #39235e0b;background:#faf9fd}
.voice{background:linear-gradient(145deg,#8a6af5,#5739c0)}
@media(max-width:520px){#voiceHero{border-radius:25px;margin-top:4px;padding-left:18px;padding-right:18px}.suggestions{border-radius:18px;padding:7px 12px}.suggestion{font-size:15px}}
@media(max-width:420px){header{padding:0 14px}.tabs button{padding:12px 18px}#voiceHero{padding-bottom:30px}.orb{width:104px;height:104px}#voiceHero p{margin-bottom:38px}}
.suggestions{width:100%;max-width:500px;margin:0 auto 12px;display:flex;flex-direction:column}
.suggestion{border:0;background:transparent;text-align:left;padding:13px 4px;font-size:17px;color:#626262;display:flex;gap:16px;align-items:center}
.suggestion span{font-size:25px;width:28px;text-align:center}
#messages{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:8px 0 22px}
.msg{padding:12px 15px;border-radius:20px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:16px}
.user{align-self:flex-end;background:#f0f0f0}
.assistant{align-self:flex-start;background:#fff}
.error{color:#b42318}
#imageLightbox{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:18px}#imageLightbox.open{display:flex}#lightboxImage{max-width:100%;max-height:88dvh;object-fit:contain;border-radius:10px}#closeLightbox{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#111;font-size:30px;line-height:1}#imageLightbox .lightboxHint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:13px}footer{flex-shrink:0;background:#fff;padding:8px 16px calc(12px + env(safe-area-inset-bottom))}
.composer{position:relative;display:flex;align-items:center;gap:8px;border-radius:38px;background:#f5f5f5;padding:8px 10px;max-width:850px;margin:auto;min-height:66px}
#prompt{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;font:16px Arial,system-ui;color:#111;max-height:120px;padding:10px 2px}
.icon{border:0;background:transparent;color:#111;width:42px;height:44px;flex-shrink:0;font-size:27px;display:grid;place-items:center;padding:0}.icon svg{width:25px;height:25px;display:block;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}#mic{color:#111}#prompt{line-height:1.35;min-height:44px}
.voice{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-size:25px}
#send{display:none}
#fileMenu{display:none;position:absolute;left:0;bottom:76px;width:min(285px,85vw);background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:7px;box-shadow:0 8px 35px #0002;z-index:5}
#fileMenu button{display:block;width:100%;padding:13px 12px;border:0;background:white;border-radius:11px;text-align:left;font-size:15px;color:#222}
#attachInfo{display:none;max-width:850px;margin:0 auto 8px;color:#555;font-size:13px;padding:0 10px;overflow-wrap:anywhere}
.note{text-align:center;color:#777;font-size:11px;margin-top:8px}
@media(min-width:700px){main{padding-left:30px;padding-right:30px}}

/* Nova AI futuristic HUD — mobile-first dark glass theme */
:root{color-scheme:dark;--text:#edf0ff;--muted:#9ca6c7;--blue:#9c8cff;--lavender:#211d3a}
html,body{background:radial-gradient(ellipse at 50% -15%,#34265f 0%,#141426 48%,#0c0d18 100%);color:var(--text)}
header{background:linear-gradient(180deg,rgba(17,17,34,.88),rgba(17,17,34,.35));border-bottom:1px solid #ffffff0b}
.round{background:#24233b;color:#f4f2ff;border:1px solid #ffffff12;box-shadow:inset 0 1px #ffffff0b}
.tabs{background:#211e36;border:1px solid #ffffff12;box-shadow:0 8px 28px #0002}
.tabs button{color:#a8a5c6}
.tabs button.active{background:linear-gradient(135deg,#f7f3ff,#dcd3ff);color:#21183e;box-shadow:0 3px 18px #8e78ff25}
#work{color:#b8aaff}
#work.active{color:#21183e}
main{scrollbar-color:#4c456e transparent}
#messages{gap:18px}
.msg{border:1px solid #ffffff0c;box-shadow:0 7px 24px #0002;line-height:1.58}
.user{background:linear-gradient(135deg,#443579,#30284e);color:#fff;border-color:#b5a1ff25;border-bottom-right-radius:7px}
.assistant{background:linear-gradient(145deg,#1c1d31,#171827);color:#e9eaff;border-color:#ffffff10;border-bottom-left-radius:7px}
.error{color:#ffaaa9}
footer{background:linear-gradient(180deg,transparent,#10111f 22%);padding-top:14px}
.composer{background:rgba(28,28,48,.94);border:1px solid #7165a655;box-shadow:0 0 0 3px #6e5b9c12,0 14px 40px #0004;backdrop-filter:blur(20px)}
#prompt{color:#f7f5ff}
#prompt::placeholder{color:#9897b3}
.icon{color:#eeecff}
.voice{background:linear-gradient(145deg,#a48dff,#6546d9);box-shadow:0 5px 18px #7455e855;color:#fff}
#plus{font-size:31px}
#fileMenu{background:#202039;border:1px solid #ffffff1b;box-shadow:0 14px 38px #0008}
#fileMenu button{background:transparent;color:#eeeaff}
#fileMenu button:active,#fileMenu button:hover{background:#343050}
#attachInfo{color:#b9b4d6}
.note{color:#85849f}
.suggestions{background:#17182a;border:1px solid #ffffff13;box-shadow:0 12px 35px #0003}
.suggestion{color:#d0cde6}
.suggestion span{color:#a99aff}
.suggestion:hover{background:#25223e}
#voiceHero{background:linear-gradient(145deg,#1e1b34,#131522);border-color:#ffffff14;box-shadow:0 18px 55px #0003}
#voiceHero p{color:#aaa8c5}
#startVoice{background:linear-gradient(110deg,#a18bff,#5b43ce);color:#fff}
#imageLightbox{background:rgba(5,5,14,.97)}
a{color:#b4a4ff}
@media(max-width:520px){header{height:78px}.composer{min-height:68px}.msg{max-width:94%}}

</style>
</head>
<body>
<header>
<button class="round" id="menuBtn">☰</button>
<div class="tabs">
<button id="chatTab" class="active">Chat</button>
<button id="work">✦ Work</button>
</div>
<button class="round" id="newChat">◌</button>
</header>

<main id="main">
<div class="spacer" id="topSpace"></div>
<section id="voiceHero" aria-label="Nova voice introduction"><div class="orb" aria-hidden="true"></div><h1>Meet Nova Voice</h1><p>More natural conversations, powered by Nova AI.</p><button id="startVoice">Start Voice</button></section>
<section class="suggestions" id="suggestions">
<button class="suggestion" data-prompt="Help me start a voice chat."><span>♧</span>Start a voice chat</button>
<button class="suggestion" data-prompt="Help me create an image or sticker."><span>▧</span>Create an image or sticker</button>
<button class="suggestion" data-prompt="Help me write or edit something."><span>✎</span>Write or edit</button>
</section>
<section id="messages" aria-live="polite"></section>
</main>

<footer>
<div id="attachInfo"></div>
<div class="composer" id="composer">
<div id="fileMenu">
<button data-kind="image">▧　Upload image from gallery</button>
<button data-kind="camera">📷　Take a photo</button>
<button data-kind="document">📎　Upload PDF or document</button>
<button data-kind="text">📝　Upload TXT / CSV</button>
<button data-kind="any">📁　Choose any file</button>
</div>
<input id="fileInput" type="file" hidden>
<button class="icon" id="plus" aria-label="Upload files">＋</button>
<textarea id="prompt" rows="1" placeholder="Ask Nova AI" aria-label="Message Nova AI"></textarea>
<button class="icon" id="mic" aria-label="Voice input" title="Voice input"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"></rect><path d="M5.5 10.5v1.2a6.5 6.5 0 0 0 13 0v-1.2M12 18.2V22M8.5 22h7"></path></svg></button>
<button class="icon voice" id="send" aria-label="Send">↑</button>
</div>
<div class="note">AI can make mistakes. Verify important information.</div>
</footer>
<div id="imageLightbox" role="dialog" aria-modal="true" aria-label="Full-screen image preview"><button id="closeLightbox" aria-label="Close image preview">×</button><img id="lightboxImage" alt="Full-screen AI generated image"><div class="lightboxHint">Tap outside or × to close</div></div>

<script>
const $=id=>document.getElementById(id);
const history=[],picked=[];
let busy=false;
function closeLightbox(){$("imageLightbox").classList.remove("open");$("lightboxImage").removeAttribute("src");}
$("closeLightbox").onclick=closeLightbox;
$("imageLightbox").onclick=e=>{if(e.target===$("imageLightbox"))closeLightbox();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox();});
let workMode=false;

function scrollBottom(){
  $("main").scrollTop=$("main").scrollHeight;
}
function add(role,text,extra=""){
  const d=document.createElement("div");
  d.className="msg "+role+(extra?" "+extra:"");
  d.textContent=text;
  $("messages").append(d);
  $("suggestions").style.display="none";
  $("voiceHero").hidden=true;
  $("topSpace").style.display="none";
  scrollBottom();
  return d;
}
function reset(){
  if(busy)return;
  history.length=0;
  picked.length=0;
  $("messages").replaceChildren();
  $("suggestions").style.display="flex";
  $("voiceHero").hidden=workMode;
  $("topSpace").style.display="block";
  $("attachInfo").style.display="none";
  $("prompt").value="";
  $("fileMenu").style.display="none";
  $("send").style.display="none";
  $("mic").style.display="grid";
}
$("newChat").onclick=reset;
$("startVoice").onclick=()=>$("mic").click();
$("menuBtn").onclick=()=>add("assistant","Nova AI menu\nUse the + button to attach a file.");
$("chatTab").onclick=()=>{
  workMode=false;
  $("voiceHero").hidden=$("messages").children.length>0;
  $("prompt").placeholder="Ask Nova AI";
  $("chatTab").classList.add("active");
  $("work").classList.remove("active");
};
$("work").onclick=()=>{
  workMode=true;
  $("voiceHero").hidden=true;
  $("prompt").placeholder="Describe an image to generate…";
  $("work").classList.add("active");
  $("chatTab").classList.remove("active");
};
$("plus").onclick=()=>{
  $("fileMenu").style.display=$("fileMenu").style.display==="block"?"none":"block";
};

$("fileMenu").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  const kind=b.dataset.kind,f=$("fileInput");
  f.removeAttribute("capture");
  f.accept=kind==="image"?"image/*":
    kind==="camera"?"image/*":
    kind==="document"?".pdf,.doc,.docx,.odt":
    kind==="text"?".txt,.md,.csv,.json":"*/*";
  if(kind==="camera")f.setAttribute("capture","environment");
  f.value="";
  $("fileMenu").style.display="none";
  f.click();
});

$("fileInput").onchange=async()=>{
  const f=$("fileInput").files[0];
  if(!f)return;
  if(f.size>5*1024*1024){
    add("assistant","Please choose a file smaller than 5 MB.","error");
    return;
  }
  const item={name:f.name,text:"",isImage:f.type.startsWith("image/")};
  try{
    if(/\.(txt|md|csv|json)$/i.test(f.name)||f.type.startsWith("text/")){
      item.text=(await f.text()).slice(0,18000);
    }else if(/\.pdf$/i.test(f.name)){
      item.text="PDF selected: "+f.name+". PDF text extraction is not enabled in this version.";
    }else if(item.isImage){
      item.text="Image selected: "+f.name+". Image understanding requires a vision-enabled backend.";
    }else{
      item.text="File selected: "+f.name+". Automatic reading is not enabled for this file type.";
    }
    picked.push(item);
    $("attachInfo").style.display="block";
    $("attachInfo").textContent="📎 "+picked.map(x=>x.name).join(" · ");
    $("prompt").focus();
  }catch(e){
    add("assistant","Could not read that file. Try another file.","error");
  }
};

$("prompt").addEventListener("input",()=>{
  const has=$("prompt").value.trim().length>0;
  $("send").style.display=has?"grid":"none";
  $("mic").style.display=has?"none":"grid";
  $("prompt").style.height="auto";
  $("prompt").style.height=Math.min($("prompt").scrollHeight,120)+"px";
});

async function send(){
  if(busy)return;
  let text=$("prompt").value.trim();
  const fileContext=picked.length?
    picked.map(f=>"[Attached file: "+f.name+"]\n"+(f.text||"(No readable text extracted)")).join("\n\n"):"";
  if(fileContext)text=(text?text+"\n\n":"Please help with these attached files.\n\n")+fileContext;
  if(!text)return;

  const displayText=$("prompt").value.trim()+
    (picked.length?"\n📎 "+picked.map(f=>f.name).join(", "):"");
  $("prompt").value="";
  $("prompt").style.height="auto";
  $("send").style.display="none";
  $("mic").style.display="grid";
  add("user",displayText);
  history.push({role:"user",content:text});
  const pending=add("assistant","Nova is thinking…");
  busy=true;
  try{
    const r=await fetch(workMode?"/api/image":"/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(workMode?{prompt:text}:{messages:history})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||"Could not get a reply.");
    if(workMode){
      if(typeof data.image!=="string" || !data.image.trim()){
        throw new Error("The image service returned no usable image. Please try a different prompt.");
      }
      pending.replaceChildren();
      const img=document.createElement("img");
      img.alt="AI generated image — tap to view full screen";
      img.title="Tap to view full screen";
      img.style.cssText="display:block;width:100%;max-width:512px;border-radius:14px;cursor:zoom-in";
      img.onclick=()=>{$("lightboxImage").src=img.src;$("imageLightbox").classList.add("open");};
      img.onload=()=>scrollBottom();
      img.onerror=()=>{
        pending.replaceChildren();
        pending.textContent="⚠ The image service returned an invalid or blocked image. Try a different, clearly adult and non-explicit prompt.";
        pending.classList.add("error");
      };
      img.src=data.image;
      pending.append(img);
      const link=document.createElement("a");
      link.href=data.image;
      link.download="nova-ai-image.png";
      link.textContent="Download image";
      link.style.cssText="display:block;margin-top:10px;color:#315fe9";
      pending.append(link);
    }else{
      const reply=String(data.reply||"No reply received.");
      pending.textContent=reply;
      history.push({role:"assistant",content:reply});
    }
  }catch(e){
    pending.textContent="⚠ "+e.message;
    pending.classList.add("error");
    history.pop();
  }finally{
    busy=false;
    scrollBottom();
  }
}
$("send").onclick=send;
$("prompt").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});
document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{
  $("prompt").value=b.dataset.prompt;
  $("prompt").dispatchEvent(new Event("input"));
  send();
});
$("mic").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    add("assistant","Voice input is not supported in this browser. Try Chrome on Android.");
    return;
  }
  const rec=new SR();
  rec.lang=navigator.language||"en-US";
  rec.onresult=e=>{
    $("prompt").value=e.results[0][0].transcript;
    $("prompt").dispatchEvent(new Event("input"));
  };
  rec.onerror=()=>add("assistant","Could not hear that. Please try again.");
  rec.start();
};
fetch("/api/health").then(r=>r.json()).catch(()=>null);
</script>
</body>
</html>
