<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Nova AI</title>
<style>
:root{--text:#171717;--muted:#666;--blue:#315fe9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,system-ui,sans-serif;background:#fff;color:var(--text)}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{height:84px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}.round{width:48px;height:48px;border:0;border-radius:50%;background:#f7f7f7;font-size:25px}.tabs{display:flex;align-items:center;background:#ececec;padding:5px;border-radius:36px}.tabs button{border:0;border-radius:30px;background:transparent;padding:12px 22px;font-size:16px}.tabs button.active{background:#fff;box-shadow:0 1px 5px #0001}#work{color:var(--blue)}main{flex:1;min-height:0;overflow:auto;padding:12px 22px 20px}.messages{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}.msg{padding:12px 15px;border-radius:20px;max-width:92%;line-height:1.5;font-size:16px;overflow-wrap:anywhere}.user{align-self:flex-end;background:#f0f0f0;white-space:pre-wrap}.assistant{align-self:flex-start;background:#fff}.error{color:#b42318}.status{color:#666;font-size:14px}.generated{max-width:100%;padding:0;background:transparent}.generated img{display:block;width:min(100%,700px);max-height:70vh;object-fit:contain;border-radius:16px;cursor:pointer;box-shadow:0 2px 12px #0001}.hero{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.hero h1{font-size:clamp(26px,6vw,38px);margin:0 0 12px}.hero p{color:#666;font-size:17px;margin:0}.settings{max-width:850px;margin:0 auto 10px;padding:12px;border:1px solid #e5e7eb;border-radius:16px;background:#fafafa}.settings[hidden]{display:none}.settings label{display:block;font-size:13px;margin:9px 0 4px}.settings input,.settings select,.settings textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff;font:inherit}.composer{position:relative;display:flex;align-items:center;gap:8px;border-radius:38px;background:#f5f5f5;padding:8px 10px;max-width:850px;margin:auto;min-height:66px}footer{flex-shrink:0;background:#fff;padding:8px 16px calc(12px + env(safe-area-inset-bottom))}#prompt{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;font:16px Arial,system-ui;color:#111;max-height:120px;padding:10px 2px}.icon{border:0;background:transparent;color:#111;width:42px;height:44px;flex-shrink:0;font-size:27px;display:grid;place-items:center}.voice{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff}#send{display:none}.note{text-align:center;color:#777;font-size:11px;margin-top:8px}#lightbox{position:fixed;inset:0;background:#000e;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}#lightbox.open{display:flex}#lightbox img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:12px}#close{position:absolute;right:14px;top:14px;width:44px;height:44px;border:0;border-radius:50%;font-size:30px;background:#fff}@media(min-width:700px){main{padding-left:30px;padding-right:30px}}
</style>
</head>
<body>
<header><button class="round" id="menu">☰</button><div class="tabs"><button id="chat" class="active">Chat</button><button id="work">✦ Work</button></div><button class="round" id="new">◌</button></div></header>
<main><section id="hero" class="hero"><h1>Meet Nova AI</h1><p>Ask anything — including “image banao”.</p></section><section id="messages" class="messages"></section></main>
<footer><div id="settings" class="settings" hidden><b>Nova owner controls</b><label>OpenRouter model ID</label><input id="model" value="openrouter/free"><label>Creativity <span id="tv">0.8</span></label><input id="temp" type="range" min="0" max="1.5" step="0.1" value="0.8"><label>Maximum response tokens</label><select id="tokens"><option value="500">500 — short</option><option value="1500" selected>1500 — balanced</option><option value="2500">2500 — detailed</option><option value="4000">4000 — long</option></select><label>Custom instructions</label><textarea id="instructions" rows="3" maxlength="2000"></textarea></div><div id="imageSettings" class="settings" hidden><b>Image controls</b><label>Style</label><select id="style"><option value="">Original prompt</option><option>Photorealistic</option><option>Anime</option><option>Fantasy</option><option>Cinematic</option><option>Digital art</option><option>Watercolor</option></select><label>Aspect ratio</label><select id="ratio"><option value="square">Square (1:1)</option><option value="portrait">Portrait (3:4)</option><option value="landscape">Landscape (4:3)</option></select><label>Negative prompt</label><input id="negative" placeholder="Things to avoid"></div><div class="composer"><textarea id="prompt" rows="1" placeholder="Ask Nova AI"></textarea><button class="icon" id="mic" aria-label="Voice input">🎙</button><button class="icon voice" id="send" aria-label="Send">↑</button></div><div class="note">AI can make mistakes. Verify important information.</div></footer>
<div id="lightbox"><button id="close">×</button><img id="bigImage" alt="Nova generated image"></div>
<script>
const $=id=>document.getElementById(id);let workMode=false,busy=false,chatHistory=[];
const imageIntent=/(\bmake\b|\bcreate\b|\bgenerate\b|\bdraw\b|\bimage\b|\bpicture\b|\bphoto\b|\billustrat|\bsticker\b|\bwallpaper\b|\bportrait\b|\bimg\b|बनाओ|बनाना|तस्वीर|फोटो|चित्र|इमेज|बना\s*do|banao|bana\s*do|tasveer|photo\s*banao|image\s*banao|tasveer\s*banao)/i;
function scroll(){requestAnimationFrame(()=>{const m=document.querySelector('main');m.scrollTop=m.scrollHeight})}
function addUser(t){const d=document.createElement('div');d.className='msg user';d.textContent=t;$('messages').appendChild(d);$('hero').style.display='none';scroll()}
function addText(t,cls='assistant'){const d=document.createElement('div');d.className='msg '+cls;d.textContent=t;$('messages').appendChild(d);scroll();return d}
function addImage(src){const d=document.createElement('div');d.className='msg generated';const img=document.createElement('img');img.src=src;img.alt='Nova generated image';img.onclick=()=>{$('bigImage').src=src;$('lightbox').classList.add('open')};d.appendChild(img);$('messages').appendChild(d);scroll()}
function setMode(work){workMode=work;$('chat').classList.toggle('active',!work);$('work').classList.toggle('active',work);$('imageSettings').hidden=!work;$('settings').hidden=true;$('prompt').placeholder=work?'Describe an image to generate…':'Ask Nova AI'}
async function generateImage(text){const status=addText('Generating your image…','status');const body={prompt:text,style:$('style').value,aspectRatio:$('ratio').value,negativePrompt:$('negative').value};const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));status.remove();if(!r.ok||!data.image)throw new Error(data.error||'Image generation failed.');addImage(data.image)}
async function chatSend(text){const messages=[...chatHistory,{role:'user',content:text}];const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,settings:{model:$('model').value,temperature:Number($('temp').value),maxTokens:Number($('tokens').value),instructions:$('instructions').value}})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Chat request failed.');const reply=String(data.reply||'').trim();chatHistory.push({role:'user',content:text},{role:'assistant',content:reply});addText(reply)}
async function send(){if(busy)return;const text=$('prompt').value.trim();if(!text)return;busy=true;$('send').style.display='none';$('mic').style.display='none';$('prompt').value='';$('prompt').style.height='auto';addUser(text);try{if(workMode||imageIntent.test(text)){await generateImage(text)}else{await chatSend(text)}}catch(e){addText(e.message||'Something went wrong.','error')}finally{busy=false;$('mic').style.display='grid'}}
$('send').onclick=send;$('prompt').addEventListener('input',()=>{const has=$('prompt').value.trim();$('send').style.display=has?'grid':'none';$('mic').style.display=has?'none':'grid';$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,120)+'px'});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('chat').onclick=()=>setMode(false);$('work').onclick=()=>setMode(true);$('menu').onclick=()=>{$('settings').hidden=!$('settings').hidden;$('imageSettings').hidden=true};$('new').onclick=()=>{if(busy)return;chatHistory=[];$('messages').replaceChildren();$('hero').style.display='flex';$('prompt').value='';setMode(false)};$('temp').oninput=()=>{$('tv').textContent=$('temp').value};$('close').onclick=()=>{$('lightbox').classList.remove('open');$('bigImage').removeAttribute('src')};$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('close').click()};
</script>
</body>
</html>
