<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff"><meta name="nova-build" content="chat-image-v3"><title>Nova AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,system-ui,sans-serif;color:#171717;background:#fff}body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none}.round{width:48px;height:48px;border:0;border-radius:50%;background:#f7f7f7;font-size:25px}.tabs{display:flex;gap:4px;background:#ececec;padding:5px;border-radius:36px}.tabs button{border:0;background:transparent;border-radius:30px;padding:12px 22px;font-size:16px}.tabs button.active{background:#fff;box-shadow:0 1px 5px #0001}#work{color:#315fe9}main{flex:1;min-height:0;overflow:auto;padding:12px 20px 20px}.messages{max-width:760px;margin:auto;display:flex;flex-direction:column;gap:14px}.msg{padding:12px 15px;border-radius:20px;max-width:92%;font-size:16px;line-height:1.5;overflow-wrap:anywhere}.user{align-self:flex-end;background:#f0f0f0;white-space:pre-wrap}.assistant{align-self:flex-start}.status{color:#666;font-size:14px}.error{color:#b42318}.generated{max-width:100%;padding:0}.generated img{width:min(100%,700px);max-height:70vh;object-fit:contain;border-radius:16px;cursor:pointer;box-shadow:0 2px 12px #0001}.hero{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.hero h1{font-size:clamp(26px,6vw,38px);margin:0 0 12px}.hero p{color:#666;font-size:17px}.composer{display:flex;align-items:center;gap:8px;max-width:850px;margin:auto;background:#f5f5f5;border-radius:38px;padding:8px 10px;min-height:66px}footer{flex:none;padding:8px 16px calc(12px + env(safe-area-inset-bottom));background:#fff}#prompt{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;font:16px Arial;max-height:120px;padding:10px 2px}.icon{border:0;background:transparent;width:44px;height:44px;font-size:27px}.voice{border-radius:50%;background:#315fe9;color:#fff}#send{display:none}.settings{max-width:850px;margin:0 auto 10px;padding:12px;border:1px solid #e5e7eb;border-radius:16px;background:#fafafa}.settings[hidden]{display:none}.settings label{display:block;font-size:13px;margin:8px 0 4px}.settings input,.settings select,.settings textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff;font:inherit}.note{text-align:center;color:#777;font-size:11px;margin-top:8px}#lightbox{position:fixed;inset:0;background:#000e;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}#lightbox.open{display:flex}#lightbox img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:12px}#close{position:absolute;right:14px;top:14px;width:44px;height:44px;border:0;border-radius:50%;font-size:30px;background:#fff}
</style></head>
<body>
<header><button class="round" id="menu">☰</button><div class="tabs"><button id="chat" class="active">Chat</button><button id="work">✦ Work</button></div><button class="round" id="new">◌</button></header>
<main><section id="hero" class="hero"><h1>Meet Nova AI</h1><p>Ask anything — including image requests.</p></section><section id="messages" class="messages"></section></main>
<footer>
<div id="settings" class="settings" hidden><b>Nova owner controls</b><label>OpenRouter model ID</label><input id="model" value="openrouter/free"><label>Creativity <span id="tv">0.8</span></label><input id="temp" type="range" min="0" max="1.5" step="0.1" value="0.8"><label>Maximum response tokens</label><select id="tokens"><option value="500">500 — short</option><option value="1500" selected>1500 — balanced</option><option value="2500">2500 — detailed</option><option value="4000">4000 — long</option></select><label>Custom instructions</label><textarea id="instructions" rows="3"></textarea></div>
<div id="imageSettings" class="settings" hidden><b>Image controls</b><label>Style</label><select id="style"><option value="">Original prompt</option><option>Photorealistic</option><option>Anime</option><option>Fantasy</option><option>Cinematic</option><option>Digital art</option><option>Watercolor</option></select><label>Aspect ratio</label><select id="ratio"><option value="square">Square (1:1)</option><option value="portrait">Portrait (3:4)</option><option value="landscape">Landscape (4:3)</option></select><label>Negative prompt</label><input id="negative" placeholder="Things to avoid"></div>
<div class="composer"><textarea id="prompt" rows="1" placeholder="Ask Nova AI"></textarea><button class="icon" id="mic">🎙</button><button class="icon voice" id="send">↑</button></div><div class="note">AI can make mistakes. Verify important information.</div></footer>
<div id="lightbox"><button id="close">×</button><img id="bigImage" alt="Nova generated image"></div>
<script>
const $=id=>document.getElementById(id);let workMode=false,busy=false,chatHistory=[];
const IMAGE_BUILD='chat-image-v3';
try{if(localStorage.getItem('nova-build')!==IMAGE_BUILD){localStorage.setItem('nova-build',IMAGE_BUILD);if(performance.getEntriesByType('navigation')[0]?.type!=='reload')location.reload()}else{localStorage.setItem('nova-build',IMAGE_BUILD)}}catch(_e){}
const imageWords=/\b(image|picture|photo|portrait|drawing|draw|illustration|sticker|wallpaper|avatar|selfie|cat|dog|puppy|kitten|horse|bird|lion|tiger|car|ferrari|bike|motorcycle|house|building|city|landscape|mountain|beach|forest|flower|dress|outfit|woman|man|girl|boy|character|anime|robot|logo|poster|scene)\b|\b(make|create|generate|draw|show|render)\b.*\b(image|picture|photo|portrait|drawing|illustration|wallpaper|avatar)\b|बनाओ|बनाना|तस्वीर|फोटो|चित्र|इमेज|चेहरा|लड़की|लड़का|घर|कार|banao|bana do|tasveer|photo banao|image banao|tasveer banao/i;
const question=/[?？]$|^(who|what|when|where|why|how|which|can|could|would|should|is|are|am|do|does|did|tell|explain|kya|kaun|kab|kahan|kyun|kaise|hai|hain|batao|kyu|कौन|क्या|कब|कहाँ|क्यों|कैसे|है|हैं|बताओ)\b/i;
const chatPhrases=/^(hi|hello|hey|thanks|thank you|good morning|good night|ok|okay|yes|no|haan|nahi|namaste)\b/i;
function looksLikeImageSubject(s){const raw=s.trim();if(!raw||raw.length>100||question.test(raw)||chatPhrases.test(raw))return false;const lower=raw.toLowerCase();if(imageWords.test(raw)||/\b(make|create|generate|draw|show|render)\b.*\b(image|picture|photo|portrait|drawing|illustration|wallpaper|avatar)\b/i.test(lower))return true;const w=raw.split(/\s+/);if(w.length<2||w.length>5)return false;const caps=w.filter(x=>/^[A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ'’-]*$/.test(x));return caps.length>=2}
function scroll(){requestAnimationFrame(()=>{const m=document.querySelector('main');m.scrollTop=m.scrollHeight})}
function user(t){const d=document.createElement('div');d.className='msg user';d.textContent=t;$('messages').appendChild(d);$('hero').style.display='none';scroll()}
function text(t,c='assistant'){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('messages').appendChild(d);scroll();return d}
function image(src){const d=document.createElement('div');d.className='msg generated';const i=document.createElement('img');i.src=src;i.alt='Nova generated image';i.onclick=()=>{$('bigImage').src=src;$('lightbox').classList.add('open')};d.appendChild(i);$('messages').appendChild(d);scroll()}
async function generate(prompt){const s=text('Generating your image…','status');const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,style:$('style').value,aspectRatio:$('ratio').value,negativePrompt:$('negative').value})});const d=await r.json().catch(()=>({}));s.remove();if(!r.ok||!d.image)throw Error(d.error||'Image generation failed.');image(d.image)}
async function chatSend(content){const messages=[...chatHistory,{role:'user',content}];const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,settings:{model:$('model').value,temperature:+$('temp').value,maxTokens:+$('tokens').value,instructions:$('instructions').value}})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Chat request failed.');if(d.image){image(d.image);chatHistory.push({role:'user',content},{role:'assistant',content:'[Image generated]'});return}const reply=String(d.reply||'').trim();chatHistory.push({role:'user',content},{role:'assistant',content:reply});text(reply)}
async function send(){if(busy)return;const p=$('prompt').value.trim();if(!p)return;busy=true;$('prompt').value='';$('prompt').style.height='auto';$('send').style.display='none';$('mic').style.display='none';user(p);try{if(workMode||looksLikeImageSubject(p))await generate(p);else await chatSend(p)}catch(e){text(e.message||'Something went wrong.','error')}finally{busy=false;$('mic').style.display='grid'}}
function mode(work){workMode=work;$('chat').classList.toggle('active',!work);$('work').classList.toggle('active',work);$('imageSettings').hidden=!work;$('settings').hidden=true;$('prompt').placeholder=work?'Describe an image to generate…':'Ask Nova AI'}
$('send').onclick=send;$('prompt').addEventListener('input',()=>{const h=$('prompt').value.trim();$('send').style.display=h?'grid':'none';$('mic').style.display=h?'none':'grid';$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,120)+'px'});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('chat').onclick=()=>mode(false);$('work').onclick=()=>mode(true);$('menu').onclick=()=>{$('settings').hidden=!$('settings').hidden;$('imageSettings').hidden=true};$('new').onclick=()=>{if(busy)return;chatHistory=[];$('messages').replaceChildren();$('hero').style.display='flex';$('prompt').value='';mode(false)};$('temp').oninput=()=>{$('tv').textContent=$('temp').value};$('close').onclick=()=>{$('lightbox').classList.remove('open');$('bigImage').removeAttribute('src')};$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('close').click()};
</script></body></html>
